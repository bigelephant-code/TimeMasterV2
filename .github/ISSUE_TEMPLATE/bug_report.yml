name: Bug report
description: Report a reproducible TimeMaster V2 problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TimeMaster V2.

        **Privacy warning:** never attach your real `data.json`, backups, financial records, task or calendar content, location, API keys, tokens, passwords, or other personal data. Use fictional values and redact screenshots and logs before uploading them.

        For a suspected security vulnerability, use the private security-reporting link instead of a public issue.

  - type: input
    id: version
    attributes:
      label: TimeMaster V2 version
      description: Find this in the application or release filename.
      placeholder: 0.1.3
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release installer
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, x64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence using fictional sample data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include an exact error message when safe, but remove paths, usernames, and personal content.
    validations:
      required: true

  - type: textarea
    id: frequency
    attributes:
      label: Reproduction rate and recent changes
      description: Does it happen every time? Did it begin after an update or settings change?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Attach only redacted screenshots or minimal logs made with fictional data. Do not upload data files or backups.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a matching report.
          required: true
        - label: I removed personal data, financial or location information, credentials, secrets, and identifying file paths from this report and its attachments.
          required: true
        - label: This is not a security vulnerability.
          required: true

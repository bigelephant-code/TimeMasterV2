name: Feature request
description: Propose a focused, testable improvement to TimeMaster V2
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the proposed interface. TimeMaster V2 is local-first, so explain any networking, telemetry, account, or data-format implications.

        **Privacy warning:** use fictional examples. Never upload real `data.json`, backups, financial records, task or calendar content, location, credentials, keys, tokens, or secrets.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who is affected, what are they trying to accomplish, and what blocks them today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and what success would look like.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional. Include alternatives or a small interaction example if useful.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Calendar
        - Tasks and Eisenhower matrix
        - Focus sessions and goals
        - Expenses
        - Weather or location
        - Desktop widget
        - Backup, restore, import, or export
        - Accessibility or localization
        - Build, packaging, or contributor tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Privacy, security, and data compatibility
      description: Would this add networking, telemetry, permissions, a third-party service, or a change to saved data? Describe migration and rollback needs.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List a few concrete checks that would demonstrate completion.
      placeholder: |
        - [ ] Existing local data remains readable
        - [ ] The feature works without an account
        - [ ] Keyboard navigation is supported
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: All examples and attachments are fictional or fully redacted and contain no personal data or secrets.
          required: true

name: 功能建议
description: 建议一个可验证的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述使用场景，而不是只给出按钮或页面方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 数据兼容与隐私影响
      description: 是否需要迁移旧数据或新增联网能力？
